name: CI

on:
  push:
    branches: [main]
    # Dependency manifests are resolved by dependency-lock.yml, which runs the
    # full test/audit/build suite before committing the refreshed lockfiles.
    paths-ignore:
      - 'composer.json'
      - 'package.json'
      - '.github/workflows/dependency-lock.yml'
      - 'README.md'
      - 'DOC/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: PHP tests, dependency security, static analysis and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify migrations roll back and reapply cleanly
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run PHP static analysis
        run: composer analyse

      - name: Run Laravel tests
        run: php artisan test

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

  mysql-integration:
    name: MySQL 8.4 migrations and backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bahnes_test
          MYSQL_USER: bahnes
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bahnes_test
      DB_USERNAME: bahnes
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.4 with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_mysql, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify MySQL migrations roll back and reapply cleanly
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run backend feature tests against MySQL
        run: php artisan test

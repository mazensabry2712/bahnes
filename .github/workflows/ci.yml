name: CI

on:
  push:
    branches: [main]
    # Dependency manifests are resolved by dependency-lock.yml, which runs the
    # full test/audit/build suite before committing the refreshed lockfiles.
    paths-ignore:
      - 'composer.json'
      - 'package.json'
      - '.github/workflows/dependency-lock.yml'
      - 'README.md'
      - 'DOC/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: PHP tests, dependency security, static analysis and frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify migrations roll back and reapply cleanly
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run PHP static analysis
        run: composer analyse

      - name: Run Laravel tests
        run: php artisan test

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build
